<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Walkthrough</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{--k:#0A0A0A;--w:#F0EDE8;--g:#7A7A7A;--l:rgba(240,237,232,.34);--mono:"Space Mono","IBM Plex Sans Thai",ui-monospace,Menlo,Consolas,monospace;--disp:"Bebas Neue","IBM Plex Sans Thai",Impact,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#0A0A0A;font-family:var(--mono);color:var(--w);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%!important;height:100%!important;touch-action:none;display:block}
button{font:inherit;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--w);background:rgba(10,10,10,.72);border:1px solid var(--l);border-radius:0;padding:11px 16px;cursor:pointer;transition:background .2s,color .2s}
button.on{background:var(--w);color:var(--k);border-color:var(--w)}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:rgba(10,10,10,.66);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:10;text-align:center;padding:24px;box-sizing:border-box}
#menu.hide{display:none}
h1{margin:0;font-family:var(--disp);font-weight:400;letter-spacing:.12em;font-size:clamp(64px,20vw,132px);line-height:.9}
.sub,.zones{font-size:10px;letter-spacing:.22em;text-transform:uppercase;max-width:90vw;line-height:1.9}
.sub{color:#C8C4BC}.zones{color:var(--g)}
.row{display:flex;gap:0;flex-wrap:wrap;justify-content:center}.row button+button{border-left:0}
#enter{font-size:12px;padding:16px 46px;letter-spacing:.3em;background:var(--w);color:var(--k);border:2px solid var(--w)}
#enter:disabled{opacity:.35;cursor:default}
.help{font-size:10px;letter-spacing:.06em;color:var(--g);max-width:420px;line-height:1.9}
#loader{width:min(280px,70vw)}#ltrack{height:1px;background:#3A3A3A;overflow:hidden}#lbar{height:100%;width:0;background:var(--w);transition:width .25s}
#ltext{font-size:10px;color:var(--g);margin-top:10px;letter-spacing:.18em;text-transform:uppercase}
#err{color:#ff9b8a;font-size:12px;max-width:90vw;white-space:pre-wrap}
#hud{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:3;text-align:right;pointer-events:none}
#zone{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--w);background:rgba(10,10,10,.72);border-right:2px solid var(--w);padding:11px 12px 11px 14px;display:inline-block;line-height:1.3}
#zone:empty{display:none}
#fps{font-size:10px;color:#fff;opacity:.45;margin-top:4px;font-variant-numeric:tabular-nums}
#tb{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:3;display:none;gap:0}
#tb button{padding:11px 14px;font-size:10px}#tb button+button{border-left:0}
#hint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:rgba(10,10,10,.72);border:1px solid var(--l);padding:9px 14px;z-index:3;display:none;pointer-events:none;white-space:nowrap}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid rgba(240,237,232,.6);background:rgba(10,10,10,.18);display:none;z-index:2;pointer-events:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(240,237,232,.85)}
#card{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(380px,calc(100vw - 24px));background:rgba(10,10,10,.94);border:1px solid var(--l);padding:20px 18px 18px;z-index:6;display:none;box-sizing:border-box}
#card h2{margin:0 0 10px;font-family:var(--disp);font-weight:400;font-size:34px;line-height:1;letter-spacing:.06em;padding-right:44px;text-transform:uppercase}
#card .badge{display:inline-block;font-size:9px;letter-spacing:.18em;text-transform:uppercase;padding:5px 8px;margin-bottom:10px;border:1px solid var(--l)}
.b-ready{background:var(--w);color:var(--k);border-color:var(--w)!important}.b-wip{color:var(--w)}
#card table{width:100%;font-size:11px;border-collapse:collapse;margin:4px 0 10px}
#card td{padding:7px 0;border-bottom:1px solid #2a2a2a;vertical-align:top;letter-spacing:.04em}#card td:first-child{color:var(--g);width:32%;text-transform:uppercase;font-size:9px;letter-spacing:.18em;padding-top:9px}
#card p{font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:13px;line-height:1.6;margin:8px 0 14px;color:#C8C4BC}
#card .x{position:absolute;right:10px;top:10px;padding:8px 11px;font-size:11px;letter-spacing:0}
#card .cta{display:block;text-align:center;background:var(--w);color:var(--k);text-decoration:none;font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding:14px;border:2px solid var(--w)}
#map{position:fixed;inset:0;background:rgba(10,10,10,.84);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;box-sizing:border-box}
#map .grid{display:grid;grid-template-columns:1fr 1fr;gap:0;width:min(420px,100%);border-top:1px solid var(--l);border-left:1px solid var(--l)}
#map .grid button{padding:16px 12px;text-align:left;border:0;border-right:1px solid var(--l);border-bottom:1px solid var(--l);background:transparent}
#map .grid button b{font-weight:400;display:block;font-size:11px}#map .grid button small{display:block;color:var(--g);font-size:9px;margin-top:5px;letter-spacing:.12em}
#map h3{margin:0;font-family:var(--disp);font-weight:400;font-size:40px;letter-spacing:.14em}
#tb .tbb{display:inline-block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--w);background:rgba(10,10,10,.72);border:1px solid var(--l);border-right:0;padding:11px 12px;text-decoration:none;line-height:normal}
#tb button{padding:11px 12px}
#hud{top:calc(max(12px,env(safe-area-inset-top)) + 46px);left:12px;right:auto;text-align:left}
#zone{border-right:0;border-left:2px solid var(--w);padding:8px 12px}
.back{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--g);text-decoration:none;border-bottom:1px solid #3A3A3A;padding-bottom:3px}
#logo{width:min(250px,58vw);height:auto;display:block}
.vs{font-family:var(--disp);font-size:clamp(30px,8.6vw,46px);letter-spacing:.14em;line-height:1;margin-top:-4px}
#menu .sub{white-space:pre-line;max-width:min(420px,84vw);font-family:"IBM Plex Sans Thai",var(--mono);font-size:13px;letter-spacing:.02em;text-transform:none;line-height:1.7;color:#C8C4BC}
#menu .zones{font-size:10px;letter-spacing:.24em;color:var(--w)}
.lang{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;display:flex;align-items:center;gap:2px;font-size:10px;letter-spacing:.18em}
.lang button{background:none;border:0;padding:10px 10px;color:#3A3A3A;font-size:10px;letter-spacing:.18em}.lang button.on{background:none;color:var(--w)}.lang span{color:#3A3A3A}
html[lang=th] button,html[lang=th] #zone,html[lang=th] #hint,html[lang=th] .zones,html[lang=th] .back,html[lang=th] #tb .tbb,html[lang=th] #ltext{letter-spacing:.06em;font-family:"IBM Plex Sans Thai",var(--mono);font-size:12px}
html[lang=th] .vs{letter-spacing:.04em}
#brand{font-size:clamp(54px,16vw,110px)}#brand:empty{display:none}
</style>
</head><body>
<div id="tb"><a class="home tbb" data-i="site">&larr; Site</a><button id="mb" data-i="menu">Menu</button><button id="mapb" data-i="map">Map</button><button id="lightb">Lights on</button></div>
<div id="hud"><div id="zone"></div><div id="fps"></div></div>
<div id="hint" data-i="hint"></div>
<div id="joy"><div id="knob"></div></div>
<div id="card"><button class="x" id="cx" aria-label="Close">&#10005;</button><div id="cbody"></div></div>
<div id="map"><h3 data-i="maph">MAP</h3><div class="grid" id="mapgrid"></div><button id="mapx" data-i="close">Close</button></div>
<div id="menu">
 <div class="lang"><button data-l="en">EN</button><span>|</span><button data-l="th">TH</button></div>
 <!-- brand: a logo image (set CONFIG.logo) or the name in Bebas Neue -->
 <img id="logo" alt="" style="display:none"><h1 id="brand"></h1>
 <div class="vs" data-i="title"></div>
 <div class="sub" data-i="intro"></div>
 <div id="loader"><div id="ltrack"><div id="lbar"></div></div><div id="ltext">Loading&hellip;</div></div>
 <div class="row" id="q"><button data-q="low" data-i="qlow">Low</button><button data-q="med" data-i="qmed">Medium</button><button data-q="high" data-i="qhigh">High</button></div>
 <button id="enter" disabled>LOADING</button>
 <div class="help" id="help"></div>
 <a class="home back" data-i="back"></a>
 <div id="err"></div>
</div>
<script src="app.js?v=1"></script>
</body></html>
